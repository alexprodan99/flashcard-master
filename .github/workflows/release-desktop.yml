name: Release Desktop App

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "--win"
            artifact_pattern: "dist-desktop/*.exe"
          - os: macos-latest
            target: "--mac"
            artifact_pattern: "dist-desktop/*.dmg"
          - os: ubuntu-latest
            target: "--linux"
            artifact_pattern: "dist-desktop/*.AppImage dist-desktop/*.deb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot dpkg

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build All Monorepo Packages
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Package Standalone Desktop Application (${{ matrix.os }})
        run: npm run --workspace=@flashcard-master/desktop dist -- ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: "electron-builder"

      - name: Publish Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact_pattern }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
