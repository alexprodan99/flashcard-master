name: Publish Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. latest, beta)"
        required: true
        default: "latest"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish to npm Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Build All Monorepo Workspaces
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Publish @flashcard-master/core
        run: npm publish -w @flashcard-master/core --access public --tag ${{ github.event.inputs.tag || 'latest' }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @flashcard-master/adapters
        run: npm publish -w @flashcard-master/adapters --access public --tag ${{ github.event.inputs.tag || 'latest' }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @flashcard-master/web
        run: npm publish -w @flashcard-master/web --access public --tag ${{ github.event.inputs.tag || 'latest' }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @flashcard-master/cli
        run: npm publish -w @flashcard-master/cli --access public --tag ${{ github.event.inputs.tag || 'latest' }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
